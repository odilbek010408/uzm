        <div class="bg-white p-[30px] rounded-[12px] shadow-[0_4px_15px_rgba(0,0,0,0.1)] w-full max-w-[380px]">
            <h2 class="mt-0 text-center text-[#333] text-2xl font-bold mb-5">Ro'yxatdan o'tish</h2>

            <form id="regForm">
                <div class="mb-[15px]">
                    <label for="name" class="block mb-[5px] text-[#666] text-sm">Ismingiz:</label>
                    <input type="text" id="name" placeholder="Masalan: Ali" required class="w-full text-white p-[10px] border border-[#ccc] rounded-[6px] text-base focus:outline-none focus:border-[#0088cc]">
                </div>

                <div class="mb-[15px]">
                    <label for="email" class="block mb-[5px] text-[#666] text-sm">Elektron pochta manzilingiz:</label>
                    <input type="email" id="email" placeholder="example@gmail.com" required class="w-full text-white p-[10px] border border-[#ccc] rounded-[6px] text-base focus:outline-none focus:border-[#0088cc]">
                </div>

                <button type="submit" class="w-full p-[12px] text-base text-white bg-[#0088cc] border-none rounded-[6px] font-bold cursor-pointer hover:bg-[#006699] transition-colors">
            Ro'yxatdan o'tish
        </button>
            </form>
        </div>
    </div>
</div>
<script>
    document.getElementById('regForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const name = document.getElementById('name').value;
        const email = document.getElementById('email').value;

        fetch('http://127.0.0.1:5000/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    name: name,
                    email: email
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    alert("✅ Ro'yxatdan o'tdingiz! Ma'lumotlar Telegramga yuborildi.");
                    document.getElementById('regForm').reset();
                } else {
                    alert("❌ Xatolik: " + data.message);
                }
            })
            .catch(error => {
                console.error("Xatolik:", error);
                alert("Server bilan bog'lanib bo'lmadi. Python (app.py) yoniqligini tekshiring.");
            });
    });
</script>
